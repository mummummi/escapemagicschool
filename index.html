<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>달빛 마법 학교의 비밀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root{--bg:#12141c;--panel:#1e2130;--panel2:#282c40;--ink:#f3efe4;--muted:#a9a6b8;--gold:#f2c14e;--red:#e85d5d;--green:#5fd39a;--line:#3a3f57}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 50% 0%,#232842 0%,var(--bg) 60%);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;min-height:100vh;font-size:18px;line-height:1.6;-webkit-user-select:none;user-select:none}
  .wrap{max-width:980px;margin:0 auto;padding:16px 14px 40px}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .brand{font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--gold)}
  .stats{display:flex;gap:8px;font-size:15px;flex-wrap:wrap}
  .pill{background:var(--panel);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
  h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:36px;margin:0 0 6px;color:var(--gold)}
  h2{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;margin:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
  .story{background:var(--panel2);border-left:4px solid var(--gold);padding:14px 16px;border-radius:10px;margin:14px 0;text-align:left}
  .center{text-align:center}
  .muted{color:var(--muted);font-size:15px}
  button{font-family:inherit;font-size:18px;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font-weight:bold}
  .btn{background:var(--gold);color:#2a2100}
  .ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .roombar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px;gap:8px;flex-wrap:wrap}
  .scene{position:relative;width:100%;border-radius:16px;overflow:hidden;border:2px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .hot{cursor:pointer}
  .obj{position:absolute;transform:translate(-50%,-50%);cursor:pointer;line-height:1;transition:transform .15s,filter .15s;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
  .obj:hover{transform:translate(-50%,-50%) scale(1.12);filter:drop-shadow(0 0 10px rgba(242,193,78,.8))}
  .obj .seen{position:absolute;right:-4px;top:-4px;font-size:12px;background:var(--green);color:#000;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-weight:bold}
  .inv{display:flex;gap:8px;align-items:center;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-height:62px;flex-wrap:wrap}
  .inv .lbl{color:var(--muted);font-size:14px;margin-right:4px}
  .item{display:flex;align-items:center;gap:6px;background:var(--panel2);border:2px solid transparent;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:15px}
  .item span{font-size:24px}
  .item.sel{border-color:var(--gold);background:#3b3420}
  .selinfo{margin-left:auto;font-size:14px;color:var(--gold)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
  .modal.show{display:flex}
  .modal .card{width:100%;max-width:620px;max-height:92vh;overflow:auto;animation:pop .2s}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
  .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .x{background:transparent;color:var(--muted);font-size:26px;padding:0 6px}
  .box{background:#161925;border:1px dashed var(--line);border-radius:12px;padding:16px;margin:10px 0;text-align:center}
  .paper{background:#fbf6e6;color:#2b2414;border-radius:6px;padding:16px 18px;text-align:left;box-shadow:0 4px 12px rgba(0,0,0,.4);font-size:17px}
  .paper table{border-collapse:collapse;margin:8px auto}
  .paper td{padding:3px 10px;border-bottom:1px solid #d9cfb3}
  .paper td.c{font-family:monospace;font-size:22px;font-weight:bold;letter-spacing:4px}
  .lockform{display:flex;gap:8px;margin-top:12px}
  .lockform input{flex:1;min-width:0;font-size:24px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#0e1018;color:var(--ink);font-family:monospace;letter-spacing:6px;text-align:center;-webkit-user-select:text;user-select:text}
  .lockform input:focus{outline:none;border-color:var(--gold)}
  .msg{min-height:26px;margin-top:8px;font-weight:bold;text-align:center}
  .msg.bad{color:var(--red)}.msg.good{color:var(--green)}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .chalk{background:#1f4d36;border:10px solid #7a5230;border-radius:6px;color:#eef;padding:18px;font-size:24px;text-align:center}
  .poster{position:relative;height:240px;background:#fff;border-radius:6px;overflow:hidden;transition:background .4s}
  .poster .msgtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2a46ff;font-size:24px;font-weight:bold;line-height:1.5}
  .poster .noise{position:absolute;font-weight:bold;color:#ff2a2a;pointer-events:none;transition:color .4s}
  .poster.filtered{background:#ff9d9d}
  .poster.filtered .noise{color:#ff9d9d;opacity:0}
  .poster.filtered .msgtxt{color:#2a0010}
  .ptable{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;font-size:13px}
  .ptable div{background:#2f3a5c;border-radius:4px;padding:4px 0;text-align:center}
  .ptable b{display:block;font-size:18px;color:#fff}
  .ptable small{color:#9fb0e0}
  .scale{font-size:30px;margin:6px 0;letter-spacing:4px}
  .scope{width:220px;height:220px;border-radius:50%;margin:0 auto;background:radial-gradient(circle,#e8f3ff 0%,#a9c3dc 70%,#223 72%);display:flex;align-items:center;justify-content:center;color:#123;font-size:26px;font-weight:bold;letter-spacing:3px;border:8px solid #333}
  .piano{position:relative;display:flex;justify-content:center;margin:12px auto 4px;height:170px;width:max-content;max-width:100%}
  .wk{width:46px;height:170px;background:#fff;border:2px solid #222;border-radius:0 0 8px 8px;cursor:pointer}
  .wk:active,.wk.hit{background:#ffe9a8}
  .bk{position:absolute;top:0;width:30px;height:105px;background:#111;border-radius:0 0 6px 6px;cursor:pointer;z-index:2}
  .bk:active{background:#444}
  .dots{display:flex;gap:8px;justify-content:center;margin-top:8px}
  .dots i{width:14px;height:14px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
  .dots i.on{background:var(--gold)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#2a2100;padding:12px 22px;border-radius:999px;font-weight:bold;z-index:30;display:none;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .toast.show{display:block;animation:pop .25s}
  .hint{background:#2b2a1f;border:1px solid #5c5330;color:#f5e6b0;padding:10px 14px;border-radius:10px;margin-top:8px;text-align:left}
  .teaser{border:2px dashed var(--gold);border-radius:14px;padding:16px;margin-top:18px}
  .big-emoji{font-size:70px;line-height:1}
  @media (max-width:560px){.wk{width:30px}.bk{width:20px}.chalk{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">🪄 달빛 마법 학교</div>
    <div class="stats">
      <span class="pill">⏱ <span id="timer">00:00</span></span>
      <span class="pill">💡 힌트 <span id="hintCount">0</span></span>
      <button class="ghost" id="resetBtn" style="font-size:13px;padding:4px 10px">처음부터</button>
    </div>
  </header>
  <main id="app"></main>
</div>

<div class="modal" id="modal"><div class="card" id="mcard">
  <div class="mhead"><h2 id="mtitle"></h2><button class="x" id="mclose">✕</button></div>
  <div id="mbody"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 달빛 마법 학교의 비밀 ================= */
const KEY='magic-escape-v1';
const ITEMS={
  wand:{e:'🪄',n:'마법 지팡이'},
  dkey:{e:'🔑',n:'기숙사 열쇠'},
  cloak:{e:'🧥',n:'투명 망토'},
  scroll:{e:'📜',n:'두루마리 통'},
  skey:{e:'🗝️',n:'비밀 계단 열쇠'},
  indic:{e:'🧪',n:'양배추 지시약'},
  herb:{e:'🌿',n:'은빛 약초'},
  root:{e:'🌱',n:'마법 뿌리'},
  potion:{e:'⚗️',n:'공중 부양 물약'},
  gear1:{e:'⚙️',n:'작은 톱니바퀴'},
  gear2:{e:'🔩',n:'큰 톱니바퀴'}
};
const paper=html=>`<div class="paper">${html}</div>`;
const box=html=>`<div class="box">${html}</div>`;
const has=id=>S.inv.includes(id);
const lbl=(x,y,t,c='#333',fs=18,fw='normal')=>`<text x="${x}" y="${y}" font-size="${fs}" text-anchor="middle" fill="${c}" font-weight="${fw}" font-family="Gowun Dodum">${t}</text>`;
function bad(id,t){const m=$(id);m.className='msg bad';m.textContent=t;const c=$('mcard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
function good(id,t){const m=$(id);m.className='msg good';m.textContent=t}
function choice(id,opts,ans,okMsg,badMsg,ok){
  return {html:`<div class="center">${opts.map(o=>`<button class="ghost ch" data-v="${o}" style="margin:4px;font-size:18px">${o}</button>`).join('')}</div><div class="msg" id="${id}"></div>`,
    bind:()=>document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{if(b.dataset.v===ans){good(id,okMsg);setTimeout(ok,1000)}else bad(id,badMsg)})};
}

/* ---------- 공통 그림 ---------- */
function stars(x,y,w,h,n,seed=3){let s='';for(let i=0;i<n;i++){seed=(seed*9301+49297)%233280;const a=seed/233280;seed=(seed*9301+49297)%233280;const b=seed/233280;s+=`<circle cx="${x+a*w}" cy="${y+b*h}" r="${1+((i*7)%3)}" fill="#fff" opacity="${.5+((i*3)%5)/10}"/>`}return s}
function bricks(c1,c2,h=660){let s=R(0,0,1600,h,c1);for(let y=0;y<h;y+=55)for(let x=((y/55)%2)*70;x<1600;x+=140)s+=R(x,y,138,53,'none',`stroke="${c2}" stroke-width="3"`);return s}
function bookshelf(x,y,w,h,seed){
  const C=['#c62828','#1565c0','#2e7d32','#6a1b9a','#ef6c00','#00838f','#8d6e63','#ad1457','#f9a825'];
  let s=R(x,y,w,h,'#5d3a1e','stroke="#3e2415" stroke-width="6"');
  for(let sy=y+12;sy+80<=y+h;sy+=92){let bx=x+10;while(true){seed=(seed*9301+49297)%233280;const r=seed/233280;const bw=14+Math.floor(r*14),bh=52+Math.floor(r*26);if(bx+bw>x+w-10)break;s+=R(bx,sy+78-bh,bw,bh,C[Math.floor(r*9)],'stroke="#0004"');bx+=bw+2}s+=R(x,sy+78,w,10,'#3e2415')}
  return s;
}
function arch(x,y,w,h,fill,stroke,sw=6){return `<path d="M${x} ${y+h} V${y+w/2} a${w/2} ${w/2} 0 0 1 ${w} 0 V${y+h} Z" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`}

/* ---------- 퍼즐 그림 ---------- */
const PLANETS=[['수성','#9e9e9e',9],['금성','#ffcc80',13],['지구','#42a5f5',14],['화성','#e57373',11],['목성','#d7a86e',26],['토성','#e6c98a',22],['천왕성','#80deea',18],['해왕성','#3f51b5',18]];
function bandGraph(){
  const D=[['마법약',30,'#ab47bc'],['천문학',25,'#42a5f5'],['동물',20,'#66bb6a'],['역사',15,'#ffa726'],['기타',10,'#bdbdbd']];let x=10,s='';
  D.forEach(([n,p,c])=>{const w=p*6;s+=`${R(x,30,w,70,c,'stroke="#fff" stroke-width="2"')}<text x="${x+w/2}" y="${p>=15?62:60}" font-size="${p>=15?16:13}" text-anchor="middle" font-weight="bold" fill="#222">${n}</text><text x="${x+w/2}" y="${p>=15?84:80}" font-size="14" text-anchor="middle" fill="#222">${p}%</text>`;x+=w});
  for(let i=0;i<=10;i++)s+=`<line x1="${10+i*60}" x2="${10+i*60}" y1="104" y2="112" stroke="#555"/><text x="${10+i*60}" y="128" font-size="11" text-anchor="middle" fill="#555">${i*10}</text>`;
  return `<svg viewBox="0 0 620 135" width="100%" style="background:#fff8e1;border-radius:10px;display:block">${lbl(310,20,'이번 달 도서관 대출 책 종류 (전체 240권)','#5d4037',15,'bold')}${s}</svg>`;
}
function gridMap(){
  const X=lon=>50+(lon+180)*2,Y=lat=>20+(90-lat)*2;let s=R(50,20,720,360,'#d7ecff');
  for(let lon=-180;lon<=180;lon+=15)s+=`<line x1="${X(lon)}" x2="${X(lon)}" y1="20" y2="380" stroke="${lon===0?'#1565c0':'#90a4ae'}" stroke-width="${lon%30===0?(lon===0?3:1.5):.6}" ${lon%30?'stroke-dasharray="3 3"':''}/>`;
  for(let lat=-90;lat<=90;lat+=15)s+=`<line x1="50" x2="770" y1="${Y(lat)}" y2="${Y(lat)}" stroke="${lat===0?'#c62828':'#90a4ae'}" stroke-width="${lat%30===0?(lat===0?3:1.5):.6}" ${lat%30?'stroke-dasharray="3 3"':''}/>`;
  for(let lon=-180;lon<=180;lon+=30)s+=`<text x="${X(lon)}" y="396" font-size="14" text-anchor="middle" fill="#333">${lon<0?'서'+(-lon):lon>0?'동'+lon:'0°'}</text>`;
  for(let lat=-90;lat<=90;lat+=30)s+=`<text x="44" y="${Y(lat)+4}" font-size="14" text-anchor="end" fill="#333">${lat>0?'북'+lat:lat<0?'남'+(-lat):'적도'}</text>`;
  [['O',37,127],['W',51,0],['L',-34,151],['A',40,-74],['E',30,31],['K',-23,-43],['N',56,37],['T',35,139]].forEach(([c,la,lo])=>{const x=X(lo),y=Y(la),lx=c==='O'?x-26:x+6;s+=`<circle cx="${x}" cy="${y}" r="5" fill="#c62828"/><rect x="${lx}" y="${y-22}" width="20" height="20" rx="4" fill="#fff" stroke="#c62828" stroke-width="2"/><text x="${lx+10}" y="${y-7}" font-size="15" font-weight="bold" text-anchor="middle" fill="#c62828">${c}</text>`});
  return `<svg viewBox="0 0 790 405" width="100%" style="background:#fbf6e6;border-radius:10px;display:block">${s}</svg>`;
}
function cylinderSVG(){
  return `<svg viewBox="0 0 420 230" width="100%" style="max-width:440px;background:#fbf6e6;border-radius:10px;display:block;margin:0 auto">
  <ellipse cx="90" cy="200" rx="50" ry="14" fill="#d7ccc8" stroke="#5d4037" stroke-width="2"/>${R(40,40,100,160,'#d7ccc8')}<line x1="40" y1="40" x2="40" y2="200" stroke="#5d4037" stroke-width="2"/><line x1="140" y1="40" x2="140" y2="200" stroke="#5d4037" stroke-width="2"/><ellipse cx="90" cy="40" rx="50" ry="14" fill="#efebe9" stroke="#5d4037" stroke-width="2"/>
  <line x1="40" y1="40" x2="140" y2="40" stroke="#c62828" stroke-width="2" stroke-dasharray="4 3"/>${lbl(90,32,'지름 10cm','#c62828',13,'bold')}${lbl(165,125,'높이','#5d4037',13)}${lbl(165,142,'30cm','#5d4037',13)}
  <path d="M190 120 h20" stroke="#555" stroke-width="3" marker-end="url(#ar)"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#555"/></marker></defs>
  ${R(230,60,170,120,'#ffe0b2','stroke="#5d4037" stroke-width="2"')}${lbl(315,125,'펼친 옆면','#5d4037',15)}${lbl(315,205,'가로 = ? cm','#c62828',17,'bold')}<line x1="230" y1="190" x2="400" y2="190" stroke="#c62828" stroke-width="2"/></svg>`;
}
function cuboidSVG(){
  return `<svg viewBox="0 0 300 200" width="100%" style="max-width:320px;background:#fbf6e6;border-radius:10px;display:block;margin:0 auto">
  <polygon points="50,80 90,45 240,45 200,80" fill="#ffe082" stroke="#5d4037" stroke-width="2"/><polygon points="200,80 240,45 240,135 200,170" fill="#ffca28" stroke="#5d4037" stroke-width="2"/>${R(50,80,150,90,'#fff3c4','stroke="#5d4037" stroke-width="2"')}
  ${lbl(125,190,'가로 5cm','#c62828',15,'bold')}${lbl(262,115,'세로','#c62828',14,'bold')}${lbl(262,132,'4cm','#c62828',14,'bold')}${lbl(25,130,'높이','#c62828',14,'bold')}${lbl(25,147,'3cm','#c62828',14,'bold')}${lbl(125,130,'약재','#8d6e63',20,'bold')}</svg>`;
}
function plantSVG(){
  const B=(x,y,n)=>`<circle cx="${x}" cy="${y}" r="13" fill="#fff" stroke="#c62828" stroke-width="3"/><text x="${x}" y="${y+6}" font-size="16" text-anchor="middle" font-weight="bold" fill="#c62828">${n}</text>`;
  return `<svg viewBox="0 0 240 280" width="220" style="display:block;margin:0 auto;background:#fbf6e6;border-radius:10px">
  ${R(0,190,240,90,'#8d6e63')}<path d="M120 190 q-10 30 -40 50 M120 190 q5 35 -5 70 M120 190 q15 25 45 45 M100 225 q-20 5 -30 20 M150 225 q15 10 18 25" stroke="#efebe9" stroke-width="3" fill="none"/>
  <line x1="120" y1="190" x2="120" y2="60" stroke="#43a047" stroke-width="7"/><ellipse cx="88" cy="120" rx="30" ry="12" fill="#66bb6a" transform="rotate(-25 88 120)"/><ellipse cx="152" cy="100" rx="30" ry="12" fill="#66bb6a" transform="rotate(25 152 100)"/>
  ${[0,72,144,216,288].map(a=>`<ellipse cx="${120+14*Math.cos(a*Math.PI/180)}" cy="${48+14*Math.sin(a*Math.PI/180)}" rx="11" ry="8" fill="#ba68c8" transform="rotate(${a} ${120+14*Math.cos(a*Math.PI/180)} ${48+14*Math.sin(a*Math.PI/180)})"/>`).join('')}<circle cx="120" cy="48" r="7" fill="#ffd54f"/>
  ${B(160,40,'①')}${B(55,105,'②')}${B(195,245,'③')}${B(145,160,'④')}</svg>`;
}
function sundialPanel(letter,alt){
  const bx=70,by=92,h=40,t=alt*Math.PI/180,sh=h/Math.tan(t);
  return `<div style="background:#fbf6e6;border-radius:10px;padding:4px;text-align:center"><svg viewBox="0 0 150 110" width="100%"><rect width="150" height="110" fill="#e3f2fd"/>${R(0,by,150,18,'#a1887f')}<circle cx="${bx-62*Math.cos(t)}" cy="${by-62*Math.sin(t)}" r="10" fill="#ffb300"/><line x1="${bx-50*Math.cos(t)}" y1="${by-50*Math.sin(t)}" x2="${bx}" y2="${by-h}" stroke="#ffb300" stroke-width="1.5" stroke-dasharray="3 3"/>${R(bx,by-2,sh,6,'#424242','opacity=".7"')}<line x1="${bx}" y1="${by}" x2="${bx}" y2="${by-h}" stroke="#5d4037" stroke-width="5"/></svg><b style="color:#3e2723;font-size:20px">${letter}</b><div style="color:#5d4037;font-size:13px">태양 고도 ${alt}°</div></div>`;
}
function clockSVG(h,m,size=220){
  const a=(deg,len,w,c)=>{const t=(deg-90)*Math.PI/180;return `<line x1="100" y1="100" x2="${100+len*Math.cos(t)}" y2="${100+len*Math.sin(t)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`};
  let n='';for(let i=1;i<=12;i++){const t=(i*30-90)*Math.PI/180;n+=`<text x="${100+74*Math.cos(t)}" y="${100+74*Math.sin(t)+7}" font-size="18" text-anchor="middle" font-weight="bold" fill="#3e2723">${i}</text>`}
  for(let i=0;i<60;i++){const t=(i*6-90)*Math.PI/180,r1=i%5?86:82;n+=`<line x1="${100+r1*Math.cos(t)}" y1="${100+r1*Math.sin(t)}" x2="${100+90*Math.cos(t)}" y2="${100+90*Math.sin(t)}" stroke="#3e2723" stroke-width="${i%5?1:3}"/>`}
  return `<svg viewBox="0 0 200 200" width="${size}" style="display:block;margin:0 auto"><circle cx="100" cy="100" r="96" fill="#f5ecd7" stroke="#b8860b" stroke-width="8"/>${n}${a((h%12)*30+m*.5,48,8,'#212121')}${a(m*6,76,4,'#c62828')}<circle cx="100" cy="100" r="6" fill="#212121"/></svg>`;
}

    '불꽃을 크게 하는 기체는 산소(②). 불이 세지면 은빛 약초와 마법 뿌리를 가진 채로 가마솥을 눌러요. 완성된 물약을 선택하고 계단 문을 눌러요.'
  ]
},
{
  name:'시계탑',scene:sceneTower,
  objects:[
    {id:'window',click(){openModal('스테인드글라스',box('햇빛이 유리창을 지나며 알록달록 빛난다. 유리 조각마다 숫자가 새겨져 있다.')+
      `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${[['#1e88e5',9],['#fdd835',8],['#8e24aa',2],['#e53935',6],['#3949ab',4],['#43a047',1],['#fb8c00',3]].map(([c,n])=>`<div style="height:70px;background:${c};border:3px solid #333;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;color:#fff;text-shadow:0 0 4px #000">${n}</div>`).join('')}</div>`+
      paper('창틀 글씨: "오르골 비밀번호 = 햇빛이 <b>프리즘</b>을 지날 때 나타나는 무지개 색 순서대로, <b>앞의 네 가지 색</b>의 숫자"'))}},
    {id:'musicbox',click(){
      if(S.f.mbox){tone(523);openModal('오르골',box('🎵 띵 띠링~ 오르골 음악이 흘러나온다.'));return}
      openModal('오르골',box('🔒 네 자리 숫자 자물쇠가 달린 오르골')+lock({placeholder:'숫자 4자리',maxlen:4}),()=>bindLock('6381',()=>{S.f.mbox=true;save();[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f),i*180));openModal('오르골',box('🎵 오르골이 열리며 음악이 흐른다. 안에 <b>작은 톱니바퀴</b>가 있다!'));give('gear1')}))}},
    {id:'sundial',click(){
      if(S.f.sun){openModal('해시계',box('해시계 받침이 열려 있다.'));return}
      const c=choice('sdm',['A','B','C','D'],'C','✅ 해시계 받침이 열렸다!','❌ 받침이 꿈쩍도 하지 않는다',()=>{S.f.sun=true;save();openModal('해시계',box('받침 안에서 <b>큰 톱니바퀴</b>를 찾았다!'));give('gear2')});
      openModal('해시계',box('해시계 옆에 계절마다 같은 시각(낮 12시 무렵)의 모습을 그린 그림 네 장이 있다.')+`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${[['A',52],['B',29],['C',76],['D',50]].map(([l,a])=>sundialPanel(l,a)).join('')}</div>`+paper('"<b>낮의 길이가 가장 길고 기온이 가장 높은 계절</b>의 그림을 골라라."')+c.html,c.bind)}},
    {id:'clock',click(){
      if(S.f.clock){openModal('시계탑의 큰 시계',box('시계가 6시 40분을 가리키고 있다. 탑 꼭대기 문 쪽에서 철컥 소리가 났었다.'));return}
      if(!S.f.gears){if(has('gear1')&&has('gear2')){consume('gear1');consume('gear2');S.f.gears=true;save()}else{openModal('시계탑의 큰 시계',box('거대한 시계가 멈춰 있다. 뒤쪽을 보니 <b>톱니바퀴 두 개</b>가 빠져 있다.'+(has('gear1')||has('gear2')?'<br><span class="muted">하나는 찾았다. 하나 더 필요하다!</span>':'')));return}}
      clockPuzzle(()=>{S.f.clock=true;save();closeModal();toast('🔔 시계탑 종이 울리고 탑 꼭대기 문의 자물쇠에 불이 들어왔다!')})}},
    {id:'bell',click(){tone(330);openModal('종',box('댕— 커다란 종이 울린다. 별건 없다.'))}},
    {id:'owl',click(){tone(600);openModal('부엉이',box('<div style="font-size:50px">🦉</div>"부엉! 꼭대기 문은 <b>영어</b>를 좋아한다네."'))}},
    {id:'door',click(){
      if(!S.f.clock){openModal('탑 꼭대기 문',box('문이 시계 장치와 연결되어 단단히 잠겨 있다. 큰 시계가 멈춰 있어서 그런 것 같다.'));return}
      openModal('탑 꼭대기 문',box('마지막 문! 영어 수수께끼가 새겨져 있다.')+paper('<b style="font-size:20px">"I have hands, but I cannot clap.<br>I have a face, but I cannot smile.<br>I tell you the time. What am I?"</b><hr><span style="color:#888">hand = 손, clap = 박수 치다, face = 얼굴, smile = 웃다, time = 시간</span>')+lock({placeholder:'영어 단어',maxlen:8}),()=>bindLock('CLOCK',()=>{closeModal();finish()}))}}
  ],
  hints:[
    '무지개 색 순서는 빨주노초파남보. 빨강 6, 주황 3, 노랑 8, 초록 1 → 6381.',
    '여름에는 태양 고도가 가장 높아서 그림자가 가장 짧아요 → C. 톱니바퀴 두 개를 모두 모은 뒤 시계를 눌러요.',
    '지구는 1시간에 15°씩 자전해요(360 ÷ 24). 45°는 3시간이니 3시 40분 + 3시간 = 6시 40분. 마지막 수수께끼: 바늘(hands)과 시계판(face)이 있는 것은 CLOCK!'
  ]
}];
function selPaper(){return paper('<b>기숙사 반장 선거 안내</b><br>① 누구에게 투표했는지 다른 사람이 알 수 없다.<br>② 일정한 나이가 되면 누구나 투표할 수 있다.<br>③ 다른 사람이 대신 투표해 줄 수 없다.<br>④ 모든 사람이 똑같이 한 표씩 투표한다.<hr>"문 비밀번호: 선거의 4원칙 <b>보통 → 평등 → 직접 → 비밀</b>에 맞는 문장 번호를 차례로"')}

/* 도서관 금지 구역: 고양이를 지나가야 조사 가능 */
rooms[1].objects.forEach(o=>{if(['map','fshelf'].includes(o.id)){const c=o.click;o.click=function(){if(!S.f.sneak){openModal('금지 구역',box('사서 고양이가 노려보고 있어서 금지 구역에 들어갈 수 없다!'));return}c.call(this)}}});

/* ---------- 시작 / 끝 ---------- */
function renderIntro(app){
  app.innerHTML=`<div class="card center"><div class="big-emoji">🪄</div><h1>달빛 마법 학교의 비밀</h1>
  <div class="muted">방 4개 · 퍼즐 17개 · 교과 + 상식·관찰·조작 퍼즐</div>
  <div class="story">마법 학교 <b>"달빛 학교"</b>에 입학한 첫날 밤. 기숙사 방에서 눈을 떠 보니 학교 전체에 <b>잠금 마법</b>이 걸려 있다!<br><br>
  기숙사 → 도서관 → 마법 약 교실 → 시계탑을 지나 <b>탑 꼭대기</b>에 올라 잠금 마법을 풀어라. 학교 곳곳에 선배 마법사들의 수수께끼가 숨어 있다!</div>
  <p class="muted">종이와 연필을 준비하면 좋아요 · 막히면 💡 힌트</p>
  <button class="btn" id="startBtn" style="font-size:22px;padding:14px 40px">모험 시작!</button></div>`;
  $('startBtn').onclick=()=>{S.room=0;S.start=Date.now();save();render()};
}
function renderEnd(app){
  const t=S.end&&S.start?fmt(S.end-S.start):'--:--';const h=S.hints.reduce((a,b)=>a+b,0);
  const rank=h===0?'🏆 대마법사':h<=3?'🥇 수석 마법사':h<=7?'🥈 견습 마법사':'🥉 마법 학교 신입생';
  app.innerHTML=`<div class="card center"><div class="big-emoji">✨</div><h1>탈출 성공!</h1>
  <p>기록 <b style="color:var(--gold)">${t}</b> · 힌트 <b style="color:var(--gold)">${h}번</b></p>
  <p style="font-size:24px">${rank}</p>
  <div class="story">탑 꼭대기 문이 열리자 보름달 빛이 쏟아지며 학교의 잠금 마법이 풀렸다! ✨<br><br>사자성어, 태양계, 비율, 선거, 위도·경도, 원기둥, 띠그래프, 겉넓이, 산과 염기, 식물, 산소, 프리즘, 계절, 지구의 자전, 영어 수수께끼까지… 모든 수수께끼를 풀어낸 당신은 진정한 마법사다!</div></div>`;
}

let S=load()||fresh();
function fresh(){return{room:-1,inv:[],sel:null,f:{},seen:{},hints:[0,0,0,0],start:null,end:null}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const norm=s=>s.replace(/\s/g,'').toUpperCase();
const $=id=>document.getElementById(id);

function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200)}
function give(id){if(!S.inv.includes(id)){S.inv.push(id);save();toast(`${ITEMS[id].e} ${ITEMS[id].n} 획득!`);renderInv()}}
function uses(id){return S.sel===id}
function consume(id){S.inv=S.inv.filter(x=>x!==id);if(S.sel===id)S.sel=null;save();renderInv()}

function openModal(title,html,setup){$('mtitle').textContent=title;$('mbody').innerHTML=html;$('modal').classList.add('show');if(setup)setup()}
function closeModal(){$('modal').classList.remove('show');render()}
$('mclose').onclick=closeModal;
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

function lock(opts){
  // opts: {label, placeholder, answer, ok(), maxlen}
  return `<div class="muted" style="text-align:center">${opts.label||''}</div>
  <form class="lockform" id="lf"><input id="li" maxlength="${opts.maxlen||8}" placeholder="${opts.placeholder||''}" autocomplete="off"><button class="btn">열기</button></form>
  <div class="msg" id="lm"></div>`;
}
function bindLock(answer,ok){
  const f=$('lf');if(!f)return;
  f.onsubmit=e=>{e.preventDefault();const v=norm($('li').value);if(!v)return;
    if(v===norm(answer)){$('lm').className='msg good';$('lm').textContent='✅ 철컥! 열렸다!';f.querySelectorAll('input,button').forEach(x=>x.disabled=true);setTimeout(ok,900)}
    else{$('lm').className='msg bad';$('lm').textContent='❌ 열리지 않는다…';const c=$('mcard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
  };
}

/* ---------- 소리 ---------- */
let actx=null;
function tone(f){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.3,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.6)}catch(e){}}

/* ---------- 장면 그리기 도우미 ---------- */
const hot=(id,inner)=>`<g class="hot" data-id="${id}">${inner}</g>`;
const R=(x,y,w,h,f,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${ex}/>`;
function woodFloor(c1,c2){let s=R(0,650,1600,350,c1);for(let y=690;y<1000;y+=45){s+=`<line x1="0" x2="1600" y1="${y}" y2="${y}" stroke="${c2}" stroke-width="3"/>`;for(let x=((y/45)%2)*120;x<1600;x+=240)s+=`<line x1="${x}" x2="${x}" y1="${y-45}" y2="${y}" stroke="${c2}" stroke-width="2"/>`}return s}
function lamps(){return [300,800,1300].map(x=>R(x-100,10,200,16,'#fffef5','rx="6" stroke="#ddd"')).join('')}
function windowPane(x,y,w,h){return `${R(x-8,y-8,w+16,h+16,'#fff')}<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#sky)"/><line x1="${x+w/2}" x2="${x+w/2}" y1="${y}" y2="${y+h}" stroke="#fff" stroke-width="8"/><line x1="${x}" x2="${x+w}" y1="${y+h/2}" y2="${y+h/2}" stroke="#fff" stroke-width="8"/><ellipse cx="${x+w*0.3}" cy="${y+h*0.25}" rx="28" ry="12" fill="#fff" opacity=".8"/>`}
function studentDesk(x,y,sc=1){const w=200*sc,h=16*sc;return `<g>${R(x-w/2,y,w,h,'#ddb983','rx="3"')}${R(x-w/2+8,y+h,w-16,40*sc,'#b98f5a')}${R(x-w/2+6,y+h+40*sc,8*sc,60*sc,'#666')}${R(x+w/2-14,y+h+40*sc,8*sc,60*sc,'#666')}${R(x-55*sc,y+90*sc,110*sc,14*sc,'#3d6fb0','rx="4"')}${R(x-50*sc,y+50*sc,100*sc,40*sc,'#4a7fc1','rx="6"')}${R(x-48*sc,y+104*sc,7*sc,40*sc,'#555')}${R(x+41*sc,y+104*sc,7*sc,40*sc,'#555')}</g>`}
function clockFace(cx,cy,r){const a=(deg,len,w,c)=>{const t=(deg-90)*Math.PI/180;return `<line x1="${cx}" y1="${cy}" x2="${cx+len*Math.cos(t)}" y2="${cy+len*Math.sin(t)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`};let ticks='';for(let i=0;i<12;i++){const t=i*30*Math.PI/180;ticks+=`<line x1="${cx+r*.8*Math.cos(t)}" y1="${cy+r*.8*Math.sin(t)}" x2="${cx+r*.92*Math.cos(t)}" y2="${cy+r*.92*Math.sin(t)}" stroke="#333" stroke-width="3"/>`}return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fffdf5" stroke="#6b4a2a" stroke-width="7"/>${ticks}${a(122.5,r*.5,6,'#111')}${a(30,r*.78,4,'#c0392b')}<circle cx="${cx}" cy="${cy}" r="4" fill="#111"/>`}
const DEFS=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fc9ff"/><stop offset="1" stop-color="#d8efff"/></linearGradient></defs>`;
const svgWrap=inner=>`<svg viewBox="0 0 1600 1000" width="100%" style="display:block">${DEFS}${inner}</svg>`;
/* ---------- 진행 ---------- */
function mx(){return Math.max(S.maxRoom||0,S.room)}
function nextRoom(t){closeModal();S.room++;S.maxRoom=Math.max(mx(),S.room);S.sel=null;save();render();if(t)toast(t)}
function goRoom(i){S.maxRoom=mx();S.room=i;S.sel=null;save();render()}
function finish(){S.end=Date.now();S.room=rooms.length;save();render()}

function renderInv(){
  const el=$('inv');if(!el)return;
  el.innerHTML=`<span class="lbl">🎒 소지품</span>`+(S.inv.length?S.inv.map(id=>`<div class="item ${S.sel===id?'sel':''}" data-id="${id}"><span>${ITEMS[id].e}</span>${ITEMS[id].n}</div>`).join(''):'<span class="muted">아직 없음</span>')+(S.sel?`<span class="selinfo">사용 중: ${ITEMS[S.sel].n} → 쓸 곳을 눌러 보세요</span>`:'');
  el.querySelectorAll('.item').forEach(it=>it.onclick=()=>{const id=it.dataset.id;S.sel=S.sel===id?null:id;save();renderInv()});
}

function render(){
  $('hintCount').textContent=S.hints.reduce((a,b)=>a+b,0);
  const app=$('app');
  if(S.room===-1)return renderIntro(app);
  if(S.room>=rooms.length)return renderEnd(app);
  const r=rooms[S.room];
  app.innerHTML=`<div class="roombar"><h2>방 ${S.room+1} / ${rooms.length} · ${r.name}</h2><div style="display:flex;gap:6px;flex-wrap:wrap">${S.room>0?`<button class="ghost" id="prevBtn">◀ 이전 방</button>`:''}${S.room<mx()?`<button class="ghost" id="nextBtn">다음 방 ▶</button>`:''}<button class="ghost" id="hintBtn">💡 힌트</button></div></div>
  <div class="scene">${r.scene()}</div><div class="inv" id="inv"></div>
  <p class="muted" style="text-align:center">방 안을 꼼꼼히 살펴보고 수상한 곳을 눌러 조사하세요. 얻은 물건은 소지품에서 눌러 선택한 뒤 쓸 곳을 누르면 돼요.</p>`;
  app.querySelectorAll('.hot').forEach(el=>{try{const b=el.getBBox();const h=document.createElementNS('http://www.w3.org/2000/svg','rect');h.setAttribute('x',b.x-6);h.setAttribute('y',b.y-6);h.setAttribute('width',b.width+12);h.setAttribute('height',b.height+12);h.setAttribute('fill','transparent');el.insertBefore(h,el.firstChild)}catch(e){}});
  app.querySelectorAll('.hot').forEach(el=>el.addEventListener('click',()=>{const o=r.objects.find(x=>x.id===el.dataset.id);if(!o)return;if(o.id==='door'&&S.room<mx()){goRoom(S.room+1);toast('이미 열어 둔 문이다. 다음 방으로!');return}o.click()}));
  if($('prevBtn'))$('prevBtn').onclick=()=>goRoom(S.room-1);
  if($('nextBtn'))$('nextBtn').onclick=()=>goRoom(S.room+1);
  $('hintBtn').onclick=showHints;
  renderInv();
}
function showHints(){
  const r=rooms[S.room];const n=S.hints[S.room];
  const html=r.hints.slice(0,n).map((h,i)=>`<div class="hint">💡 ${i+1}. ${h}</div>`).join('')+(n<r.hints.length?`<div class="center" style="margin-top:14px"><button class="btn" id="moreHint">힌트 ${n+1} 열기</button><div class="muted">힌트를 쓰면 기록에 남아요</div></div>`:'<p class="muted center">이 방의 힌트를 모두 열었어요.</p>');
  openModal(`💡 ${r.name} 힌트`,html,()=>{const b=$('moreHint');if(b)b.onclick=()=>{S.hints[S.room]++;save();$('hintCount').textContent=S.hints.reduce((a,b)=>a+b,0);showHints()}});
}
function fmt(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
setInterval(()=>{$('timer').textContent=S.start?fmt((S.end||Date.now())-S.start):'00:00'},500);
$('resetBtn').onclick=()=>openModal('처음부터 다시 할까요?','<p class="muted">지금까지 푼 기록이 모두 지워져요.</p><div class="center"><button class="btn" id="yesReset">다시 시작</button></div>',()=>{$('yesReset').onclick=()=>{S=fresh();save();closeModal()}});
render();
</script>
</body>
</html>
